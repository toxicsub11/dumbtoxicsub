          <script>
        const preview = document.querySelector('.font-preview');

        preview.addEventListener('focus', function() {
            if (preview.textContent === 'Type something...') {
                preview.textContent = '';
            }
        });

        preview.addEventListener('blur', function() {
            if (preview.textContent.trim() === '') {
                preview.textContent = 'Type something...';
            }
        });
          </script>
