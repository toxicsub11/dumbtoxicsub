<div class="data_form">          
<form action="https://script.google.com/macros/s/AKfycbwBfpX_EyvXPVJSr7gLKwAuNpld5azJ0zg_B9YL8jN-f4PMX-QkRwwH2uChbLSCM0fO/exec" method="POST">
    <label for="name">ПІБ:</label>
    <input type="text" id="name" name="name" required>

    <label for="phone">Телефон:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="address">Місто:</label>
    <input type="text" id="city" name="city" required>

    <label for="address">Куди доставити:</label>
    <input type="text" id="address" name="address" required>

    <label for="address">Контакт (Tg / Inst):</label>
    <input type="text" id="address" name="contact" required>

    <!-- Приховані поля для даних товару -->
    <input type="hidden" id="product_name" name="product_name" value="Проза">
    <input type="hidden" id="product_price" name="product_price" value="400">

    <button type="submit">Оформити замовлення</button>
</form>

<script>
    document.querySelector('form').addEventListener('submit', function(event) {
        event.preventDefault(); // Перешкоджаємо стандартному відправленню форми

        var form = event.target;
        var formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json()) // Очікуємо JSON відповідь
        .then(data => {
            alert(data.message); // Виводимо повідомлення
            // Додаткові дії після успішної відправки, наприклад, очищення форми
            form.reset(); 
        })
        .catch(error => {
            console.error('Помилка:', error);
        });
    });
</script>
</div>
