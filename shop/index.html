<script type="text/javascript">
  const link = document.querySelector('.link'); // Знаходимо елемент <a>
const hoverItems = document.querySelectorAll('.hover-item'); // Знаходимо всі елементи, на які можна наводити

hoverItems.forEach(item => {
  item.addEventListener('mouseenter', () => {
    const newText = item.getAttribute('data-text'); // Отримуємо значення з атрибута data-text
    link.textContent = newText; // Змінюємо текст <a>
    console.log('hover');
  });

  item.addEventListener('mouseleave', () => {
    link.textContent = 'Ціна'; // Повертаємо початковий текст при виході курсору
  });
});
</script>
